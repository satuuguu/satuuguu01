<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #667eea;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      color: #333333;
      margin-bottom: 8px;
    }

    .job {
      color: #667eea;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .intro {
      color: #666666;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: #667eea;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.3s, transform 0.2s;
    }

    .links a:hover {
      background: #5a67d8;
      transform: scale(1.05);
    }

    .links a.secondary {
      background: #f0f0f0;
      color: #333333;
    }

    .links a.secondary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 替换成你自己的照片：可以是本地图片，如 photo.jpg，也可以是网络图片 URL -->
    <img class="avatar" src="https://c-ssl.dtstatic.com/uploads/item/202006/03/20200603235127_rHu8W.thumb.400_0.jpeg" alt="我的照片">

    <h1>魏芳莹</h1>
    <p class="job">前端开发 / 学生 / 设计师</p>

    <p class="intro">
      你好！我是魏芳莹，热爱编程和设计。这里是我的个人主页，
      用来介绍我自己和分享一些作品。欢迎通过下面的链接联系我。
    </p>

    <div class="links">
      <a href="https://github.com/yourname" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://your-website.com" target="_blank" rel="noopener noreferrer">个人网站</a>
      <a href="mailto:2231335395@qq.com" class="secondary">邮箱</a>
    </div>
  </div>
</body>
</html>
